<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- GitHub Pages SPA fallback: decode the path 404.html redirected here as
         a query string, back into a real history entry, before the router
         mounts. Demo-hosting shim only — Cloudflare Pages doesn't need this,
         it uses public/_redirects instead. -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
