<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- GitHub Pages has no server-side rewrites, so a direct/refreshed load
         of a client-side route (e.g. /concepts/bold-grid) hits this 404 page.
         Re-encode the path into the query string and redirect to index.html,
         which decodes it back (see the inline script there) before the
         router mounts. pathSegmentsToKeep=1 matches the /ug-bikes-arena/
         project base path. Demo-hosting shim only — Cloudflare Pages doesn't
         need this, it uses public/_redirects instead.
         (Pattern: https://github.com/rafgraph/spa-github-pages) -->
    <script>
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
